services:
  sip-network:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      # Defina um token antes de expor o serviço fora de uma rede confiável.
      SIP_NETWORK_ACCESS_TOKEN: "${SIP_NETWORK_ACCESS_TOKEN:-}"
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
