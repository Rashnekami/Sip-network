[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sip-network"
version = "2.2.0"
description = "Passive SIP/SDP/RTP/RTCP analyzer for PCAP and PCAPNG"
requires-python = ">=3.11"
# The analysis engine uses only the standard library; the Streamlit UI is an optional extra.
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.39,<2", "pandas>=2.1,<3"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sip-network = "sip_network.cli:main"

[tool.setuptools.packages.find]
include = ["sip_network*"]
